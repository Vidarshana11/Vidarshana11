<!-- Data Science profile banner — updated 2026-08-19 -->
<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Vidarshana Jayasena — Data Science undergraduate</title>
  <desc id="desc">A dark violet and cyan gradient banner presenting Vidarshana Jayasena's focus on data, machine learning, and artificial intelligence.</desc>

  <defs>
    <linearGradient id="background" x1="70" y1="30" x2="1130" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="0.5" stop-color="#15112D"/>
      <stop offset="1" stop-color="#071A24"/>
    </linearGradient>
    <linearGradient id="accent" x1="250" y1="93" x2="948" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="0.48" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="line" x1="255" y1="0" x2="945" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="url(#background)"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)"/>

  <circle cx="180" cy="85" r="180" fill="url(#violetGlow)" filter="url(#blur)"/>
  <circle cx="1040" cy="275" r="190" fill="url(#cyanGlow)" filter="url(#blur)"/>

  <g opacity="0.88">
    <circle cx="94" cy="78" r="5" fill="#A78BFA"/>
    <circle cx="1105" cy="94" r="4" fill="#22D3EE"/>
    <path d="M94 78H190" stroke="#A78BFA" stroke-opacity="0.45"/>
    <path d="M1010 94H1105" stroke="#22D3EE" stroke-opacity="0.4"/>
    <path d="M110 273L143 306L193 256" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="2"/>
    <path d="M1020 246L1053 279L1103 229" stroke="#22D3EE" stroke-opacity="0.22" stroke-width="2"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="446" y="70" width="308" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.13"/>
    <circle cx="469" cy="87" r="5" fill="#34D399"/>
    <text x="486" y="92" fill="#D1FAE5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="1.15">DATA SCIENCE UNDERGRADUATE</text>

    <text x="600" y="176" fill="#F8FAFC" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="55" font-weight="760" letter-spacing="-1.8">Vidarshana Jayasena</text>
    <rect x="253" y="197" width="694" height="3" rx="1.5" fill="url(#line)"/>
    <text x="600" y="239" fill="url(#accent)" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="650" letter-spacing="1.6">DATA ENGINEERING · ANALYTICS · ML · AI</text>
    <text x="600" y="282" fill="#CBD5E1" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="400" letter-spacing="0.5">Transforming raw data into insights, models, and intelligent solutions.</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="358.5" rx="25.25" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="1.5"/>
</svg>
